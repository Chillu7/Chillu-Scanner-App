services:
  - type: web
    name: chillu-scanner
    runtime: static
    buildCommand: |
      git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git /opt/flutter
      export PATH="/opt/flutter/bin:$PATH"
      flutter --version
      flutter pub get
      flutter build web --release
    staticPublishPath: build/web
    pullRequestPreviewsEnabled: false